name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Rollback path: redeploy an image that already exists in ghcr, without
  # rebuilding. Only the deploy job runs on this trigger.
  workflow_dispatch:
    inputs:
      sha:
        description: Existing 12-char image tag to deploy (rollback)
        type: string
        required: true
      migrations_applied:
        description: Set true only if the schema this image needs is already applied
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    # A rollback deploys an image that already passed CI; re-testing it adds nothing.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The decision engine must not depend on the host's time zone.
        # Production runs in a UTC container, New York is the fixtures' zone, and
        # Sydney is a positive-offset southern-hemisphere zone (opposite DST).
        tz: [UTC, America/New_York, Australia/Sydney]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show host time zone
        run: |
          date
          cat /etc/timezone 2>/dev/null || true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # setup-dotnet's built-in cache needs packages.lock.json, which this
      # repo does not use, so cache the global packages folder directly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      # Runs every test project in the solution: Worker.Tests and Api.Tests. The
      # database tests start real Postgres 17 through Testcontainers, which uses the
      # Docker daemon already on ubuntu-latest; no service container is declared, so
      # each test assembly (and each TZ leg) gets its own throwaway database.
      #
      # global.json selects the Microsoft.Testing.Platform runner, so these are
      # MTP options (not VSTest's --logger trx flags).
      - run: dotnet test -c Release --no-build --results-directory TestResults --report-xunit-trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ strategy.job-index }}
          path: TestResults/
          if-no-files-found: warn

  image:
    name: image
    # Rollback deploys an existing image, so there is nothing to build.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No packages:write here. This job runs PR code; the registry write lives in
    # `publish`, which only main pushes reach (review, D53).
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runtime image must contain tz data or every run throws when it
      # resolves a location's zone. --self-check proves that with a fixed sample
      # zone, without network or config.
      - run: docker build -t precip:ci .

      - run: docker run --rm precip:ci --self-check

      # The tag is the commit, truncated to 12 chars, so every image maps
      # back to exactly one commit and a rollback is just "deploy that sha".
      - id: meta
        run: echo "image=ghcr.io/hobbesmd/precipitation-notification:${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      # Hand the exact bytes that passed --self-check to `publish`, instead of
      # rebuilding there. Main pushes only; PR runs stop here.
      - name: Save image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save precip:ci | gzip > image.tar.gz

      - name: Upload image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  # The migration guard and the image-only deploy script have their own tests.
  # Both build throwaway repos, so no history is needed here.
  guard-test:
    name: guard-test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: bash deploy/azure/test-migration-guard.sh

      - run: bash deploy/azure/test-deploy-image.sh

  # The only job with packages:write. It runs only for a push to main after
  # every test has passed, so no image is published for a commit that failed CI.
  publish:
    name: publish
    needs: [test, image, guard-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - run: gunzip -c image.tar.gz | docker load

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are never overwritten: a deployed sha must always mean the same
      # bytes, or a rollback would not restore what actually ran.
      # - The tag already exists: an earlier attempt of this commit published
      #   it ("Re-run all jobs" after a failed deploy). Skip the push and carry
      #   on to deploy; the tag is the commit, so nothing is replaced.
      # - "manifest unknown": absent, so push it.
      # - Anything else (429, 5xx, auth): we can't tell, so stop. Reading an
      #   error as "absent" would push over an existing tag (review, D53).
      - name: Push image (never overwrites)
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          if out=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "::notice::$IMAGE already exists (an earlier attempt published it); not pushing"
            exit 0
          fi
          if ! grep -qiE 'manifest unknown|not found' <<<"$out"; then
            echo "::error::could not tell whether $IMAGE exists; refusing to push"
            echo "$out"
            exit 1
          fi
          docker tag precip:ci "$IMAGE"
          docker push "$IMAGE"

  deploy:
    name: deploy
    needs: [publish]
    # !cancelled() lets this run on workflow_dispatch, where `publish` is
    # skipped, and still respects a cancelled run. On push it requires `publish`
    # to have succeeded, which itself required test, image and guard-test.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.publish.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: production
    # Serialize deploys but never cancel one mid-flight: a half-applied update
    # is worse than a queued one. GitHub keeps only the newest *pending* run per
    # group, so with three quick merges the middle one is dropped and the newest
    # code wins (D50).
    concurrency:
      group: production
      cancel-in-progress: false
    # id-token: write is for OIDC federation to Azure; no stored credentials.
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history: the migration guard diffs the currently deployed sha
      # against the target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned like the actions (D52): this code runs with the Azure token and
      # builds the `job update` payload. Dependabot can't bump it; update it by
      # hand after checking what the new version sends.
      - name: Install containerapp extension (pinned)
        env:
          CONTAINERAPP_EXT_VERSION: 1.3.0b5
        run: |
          az extension remove --name containerapp 2>/dev/null || true
          az extension add --name containerapp --version "$CONTAINERAPP_EXT_VERSION" -y

      # All expressions go through env: so user-controlled input (inputs.sha)
      # is data to the shell, never script text (script injection).
      - name: Resolve image
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_IMAGE: ${{ needs.publish.outputs.image }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{12}$ ]]; then
              echo "::error::sha must be exactly 12 lowercase hex chars"
              exit 1
            fi
            IMAGE="ghcr.io/hobbesmd/precipitation-notification:${INPUT_SHA}"
            # The package is public, so no login is needed. Fail now rather
            # than after Azure has accepted an image that cannot pull.
            docker manifest inspect "$IMAGE" >/dev/null
          else
            IMAGE="$PUSHED_IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # deploy-image.sh records the deployed and previous image in the step summary.
      - name: Deploy
        env:
          MIGRATIONS_APPLIED: ${{ github.event_name == 'workflow_dispatch' && inputs.migrations_applied || false }}
        run: bash deploy/azure/deploy-image.sh
